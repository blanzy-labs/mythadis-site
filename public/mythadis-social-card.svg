<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
	<title id="title">Mythadis social sharing card</title>
	<desc id="desc">A warm dark Mythadis card with active, selected, and verified network states and the line Evidence before legend.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2a211d"/>
			<stop offset="0.58" stop-color="#100d0b"/>
			<stop offset="1" stop-color="#15110f"/>
		</linearGradient>
		<linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#ff7a35" stop-opacity="0"/>
			<stop offset="0.45" stop-color="#ff7a35"/>
			<stop offset="1" stop-color="#a865b5" stop-opacity="0.72"/>
		</linearGradient>
		<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
			<feGaussianBlur stdDeviation="10" result="blur"/>
			<feMerge>
				<feMergeNode in="blur"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>
	<rect width="1200" height="630" fill="url(#bg)"/>
	<path d="M126 110H1074M126 520H1074M164 78V552M1036 78V552" fill="none" stroke="#f7efe4" stroke-opacity="0.12"/>
	<path d="M180 430L330 226L486 338L642 168L826 386L1012 248" fill="none" stroke="url(#line)" stroke-width="4" filter="url(#glow)"/>
	<path d="M210 448H440L520 334H716L800 236H1014" fill="none" stroke="#a865b5" stroke-opacity="0.48" stroke-width="3"/>
	<g fill="#ff7a35" stroke="#f7efe4" stroke-opacity="0.75">
		<rect x="166" y="416" width="32" height="32" transform="rotate(45 182 432)"/>
		<rect x="314" y="210" width="32" height="32" transform="rotate(45 330 226)"/>
		<rect x="470" y="322" width="32" height="32" fill="#a865b5" transform="rotate(45 486 338)"/>
		<rect x="626" y="152" width="32" height="32" transform="rotate(45 642 168)"/>
		<rect x="810" y="370" width="32" height="32" transform="rotate(45 826 386)"/>
		<rect x="996" y="232" width="32" height="32" fill="#6fcca2" transform="rotate(45 1012 248)"/>
	</g>
	<text x="118" y="154" fill="#f0b75f" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" letter-spacing="3">PUBLIC RECORD / MYTHADIS</text>
	<text x="118" y="304" fill="#f7efe4" font-family="Iowan Old Style, Baskerville, Times New Roman, serif" font-size="100">Mythadis</text>
	<rect x="112" y="326" width="980" height="66" rx="8" fill="#100d0b" fill-opacity="0.82"/>
	<text x="124" y="372" fill="#c4b7a8" font-family="Inter, Arial, sans-serif" font-size="34">Mythadis exists to coordinate intelligence—not just computation.</text>
	<text x="118" y="490" fill="#ff7a35" font-family="IBM Plex Mono, Consolas, monospace" font-size="24" letter-spacing="4">EVIDENCE BEFORE LEGEND</text>
</svg>
