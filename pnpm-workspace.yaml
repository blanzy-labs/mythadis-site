packages:
  - .

# Astro 7's prerender bundle imports cookie from the project root.
# Expose its installed version rather than an unrelated parent dependency.
publicHoistPattern:
  - cookie

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  fast-uri: 3.1.5
  js-yaml: 4.3.1
  nanoid: 3.3.18
  postcss: 8.5.23
